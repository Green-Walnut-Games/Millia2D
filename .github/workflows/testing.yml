name: Testing

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    actions: read

concurrency:
    group: testing-${{ github.ref }}
    cancel-in-progress: true

jobs:
    testing:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Test
              run: dotnet test
