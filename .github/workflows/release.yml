on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.x
    - name: Semver Script
      run: dotnet run scripts/increment-version.cs
      env:
        PR_NAME: "${{ github.event.head_commit.message }}"
    - name: Commit & Push changes
      uses: actions-js/push@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        message: "chore: Autopublish ${{ github.event.head_commit.id }}"
    - name: Pack
      run: dotnet pack
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    # Push the package
    - name: NuGet push
      run: dotnet nuget 'push Millia2D/bin/release/net10.0/Millia2d.*.nupkg' --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
