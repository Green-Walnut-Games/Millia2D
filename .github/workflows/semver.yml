on:
  push:
    branches:
      - main

permissions:
  actions: read
  
jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.x
    - name: Dir check
      run: ls Millia2D
    - name: Semver Script
      run: dotnet run scripts/increment-version.cs
      env:
        PR_NAME: "${{ github.event.head_commit.message }}"
    - name: Commit & Push changes
      uses: actions-js/push@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        message: "chore: Autopublish"