on:
  push:
    branches:
      - main

permissions:
  actions: read
  
jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.x
    - name: Semver Script
      run: dotnet run scripts/increment-version.cs
      env:
        PR_NAME: "${{ github.event.head_commit.message }}"