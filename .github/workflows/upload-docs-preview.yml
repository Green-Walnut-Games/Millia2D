on:
  pull_request:
      types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  publish-docs-preview:
    environment: 
      name: docs-preview
      url: https://green-walnut-games.github.io/Millia2D/${{ github.head_ref}}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.x
    - run: dotnet tool update -g docfx
    - run: docfx docfx.json
    - name: Preview pages
      uses: rajyan/preview-pages@v1
      with:
        source-dir: '_site'